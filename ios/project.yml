name: Memorize
attributes:
  LastUpgradeCheck: "9999"
options:
  bundleIdPrefix: app.memorize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
# Scheme kirjoitetaan auki, koska XcodeGen ei generoi sellaista oletuksena ja
# `xcodegen generate` pyyhkii Xcoden automaattisesti luoman xcuserdatasta.
# Ilman tätä komentorivi-build hajoaa joka kerta kun projekti regeneroidaan.
schemes:
  Memorize:
    build:
      targets:
        Memorize: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Memorize:
    type: application
    platform: iOS
    sources:
      - path: Memorize
        # CLAUDE.md-tiedostot kopioituisivat kaikki bundlen juureen ja tuottaisivat
        # "Multiple commands produce ..." -virheen. Sama ansa kuin Hetkiossa.
        excludes:
          - "**/CLAUDE.md"
          - "CLAUDE.md"
    # Info.plist generoidaan tästä, koska kutsulinkin URL-skeema on taulukko
    # sanakirjoja eikä sitä voi asettaa INFOPLIST_KEY_-muuttujilla.
    # Tiedosto on johdettu project.yml:stä, joten se on .gitignoressa.
    info:
      path: Memorize/Info.plist
      properties:
        CFBundleDisplayName: Memorize
        UILaunchScreen: {}
        # Pystyasento vain: ensisijainen käyttäjä pitää puhelinta yhdellä
        # kädellä, eikä vaakatila tuo tälle sisällölle mitään.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Sanelu on koko sovelluksen ydintoiminto — perustelu näkyy käyttäjälle
        # järjestelmän kysyessä lupaa, joten se kirjoitetaan ihmiskielellä.
        NSMicrophoneUsageDescription: >-
          Memorize tallentaa kertomasi muistot omalla äänelläsi, jotta perheesi
          voi kuunnella ne myöhemmin.
        NSPhotoLibraryUsageDescription: >-
          Valitse vanhoja valokuvia, joista perheesi voi kertoa muistoja.
        # Kutsulinkki: memorize://join?code=...
        # Universal link olisi parempi, mutta se vaatii verkkotunnuksen ja
        # AASA-tiedoston. Jaettu teksti sisältää myös koodin, joten liittyminen
        # onnistuu vaikka skeema ei aukeaisi viestisovelluksessa.
        CFBundleURLTypes:
          - CFBundleURLName: app.memorize.invite
            CFBundleURLSchemes: [memorize]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.memorize.Memorize
