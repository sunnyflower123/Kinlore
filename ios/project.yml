name: Kinlore
attributes:
  LastUpgradeCheck: "9999"
options:
  bundleIdPrefix: com.kinlore
  # English is the default from 30 Aug 2026: the app is presented, judged and
  # filmed in English, so a phone with no Finnish gets English rather than a
  # language its owner cannot read. A Finnish phone still gets Finnish, because
  # fi.lproj exists and its empty table falls through to the keys — which are
  # the Finnish source strings. The one person this was built for notices
  # nothing; everybody else stops needing a translator.
  #
  # This is the interface only. What the app HEARS is still Finnish: the
  # prompts, the ASR choice and the hallucination ceiling are calibrated on
  # Finnish speech, and PLAN.md §10 says what changing that costs.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
# The scheme is written out because XcodeGen does not generate one by default,
# and `xcodegen generate` wipes the one Xcode creates automatically in xcuserdata.
# Without this the command-line build breaks every time the project is
# regenerated.
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

schemes:
  Kinlore:
    build:
      targets:
        Kinlore: all
        KinloreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KinloreUITests
    archive:
      config: Release

  # The same app against the real backend, for testing with one's own voice.
  #
  # A DEBUG build without `-api` runs on stubs by design (AppServices), and the
  # stub is convincing: on 12 Sep 2026 a telling about a photograph came back
  # as the sample about Puumala, and nothing on the phone said why. This scheme
  # is the one to pick in Xcode when the words on the screen have to be the
  # words that were said. It costs OpenRouter credit and writes to the live
  # database, which is the point. Everything in CLAUDE.md keeps building and
  # testing `Kinlore`: the tests pass `-api` themselves, so no test can reach
  # production through this. See docs/SETUP.md.
  #
  # Release, not Debug with `-api`, since 13 Sep 2026. An argument lives only
  # as long as the process Xcode launched, so the same Debug binary opened from
  # the phone's home screen had no address: stubs again, and no onboarding
  # either, because the onboarding fork needs a backend. The phone this scheme
  # was made for held all three stub samples that day, and its People tab the
  # names in them. A Release build has the production address compiled in, so
  # every launch is the same app. DEBUG-only arguments (`-seed`, `-screen`) do
  # nothing here.
  Kinlore Production:
    build:
      targets:
        Kinlore: all
    run:
      config: Release

targets:
  Kinlore:
    type: application
    platform: iOS
    sources:
      - path: Kinlore
        # Every CLAUDE.md would be copied to the bundle root and produce a
        # "Multiple commands produce ..." error. The same trap as in Hetkio.
        excludes:
          - "**/CLAUDE.md"
          - "CLAUDE.md"
    # Info.plist is generated from here, because the invite link's URL scheme is
    # an array of dictionaries and cannot be set with INFOPLIST_KEY_ variables.
    # The file is derived from project.yml, so it is in .gitignore.
    info:
      path: Kinlore/Info.plist
      properties:
        CFBundleDisplayName: Kinlore
        # An empty launch screen meant the app opened on a white flash. Parchment
        # makes the first frame belong to the app — it is also the first frame of
        # the demo video.
        #
        # Colour only, no UIImageName: iOS draws the launch image on an opaque
        # white plate, which showed as a white card behind the mark. A transparent
        # PNG and an opaque parchment one both came out white. A splash screen
        # holding the mark was the other option and was rejected: making an
        # 80-year-old wait to admire a logo is the opposite of this app.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        # Portrait only: the primary user holds the phone in one hand, and
        # landscape adds nothing for this content.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Dictation is the app's core function — the justification is shown to
        # the user when the system asks for permission, so it is written in plain
        # language. Finnish, because the user reads it.
        # Says where the recording goes, not only that there is one. This is the
        # only moment iOS gives us before the first recording, and until now the
        # app never told anybody — anywhere — that the audio leaves the phone.
        NSMicrophoneUsageDescription: >-
          Kinlore tallentaa kertomasi muistot omalla äänelläsi, jotta perheesi
          voi kuunnella ne myöhemmin. Perheen arkistossa äänitys lähetetään
          palveluumme, jossa puheesta kirjoitetaan teksti.
        NSPhotoLibraryUsageDescription: >-
          Valitse vanhoja valokuvia, joista perheesi voi kertoa muistoja.
        # The shoebox. An 80-year-old's photographs are not in this phone's
        # library — they are in an album on a shelf, and somebody has to
        # photograph them. Says what happens, in the same plain Finnish as the
        # microphone's, because the user reads it.
        NSCameraUsageDescription: >-
          Kinlore kuvaa vanhat valokuvat talteen, jotta perheesi voi kertoa
          niistä muistonsa.
        # Invite link: kinlore://join?code=...
        # A universal link would be better, but it requires a domain and an AASA
        # file. The shared text also contains the code, so joining works even if
        # the scheme does not open in the messaging app.
        CFBundleURLTypes:
          - CFBundleURLName: com.kinlore.invite
            CFBundleURLSchemes: [kinlore]
    # Signing, from a file rather than from Xcode's UI: the generated project
    # is replaced on every `xcodegen generate`, and the team the UI writes into
    # it goes with it. Signing.xcconfig is tracked and carries no team of its
    # own — it optionally includes the local file that does.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      # A ready-made paywall UI: building our own would be work without benefit,
      # and RevenueCat's own supports remote configuration.
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinlore.app
        # XcodeGen finds Assets.xcassets from sources, but does not know which of
        # the assets is the app icon. Without this the icon slot stays empty.
        # The PNGs are generated from the SVGs in docs/logo/, see its README.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's blue. iOS's own #007AFF measures 4.0:1 against white, under
        # the 4.5:1 minimum, and the accessibility audit found it failing on
        # every tinted button and every tinted line of text in the app at once.
        # #0B57D0 measures 5.54:1 on the app's paper (6.4:1 on white) and is one
        # place to change rather than thirty.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Accessibility is not a checklist item in this app, it is the product (rule 1
  # in CLAUDE.md) — and it was the one rule with no way to check it. VoiceOver
  # reads the accessibility tree, XCUITest queries the same tree, and
  # performAccessibilityAudit() walks it for the failures that are invisible on a
  # screenshot: an unlabelled control, a tap target under the minimum, text that
  # clips instead of wrapping at the largest size.
  KinloreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KinloreUITests
    dependencies:
      - target: Kinlore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinlore.app.uitests
        TEST_TARGET_NAME: Kinlore
        # The app's Info.plist is written out because of the URL scheme; a test
        # bundle needs none of that, so it gets the generated one. Without this
        # the build fails at code signing rather than at compile time, which
        # reads like a certificate problem and is not one.
        GENERATE_INFOPLIST_FILE: "YES"
