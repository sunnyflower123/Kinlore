# The checks a stranger can trust without taking anybody's word for it.
#
# NOTHING HERE RUNS AT THE MOMENT, and the reason is not in this file. The
# account's included Actions minutes are spent, so every run is refused before
# a runner is allocated and dies in four to five seconds. That looks exactly
# like a broken build from the outside — a red tick, no output — and it is not
# one: no step ever executed. Measured on the billing page rather than guessed.
#
# It comes back by itself when the month rolls over, and it stops mattering the
# day this repository goes public, because Actions is free and unmetered there.
#
# The split below is still the right shape and was worth making. Actions is
# metered on private repositories and a macOS minute counts as ten, so the check
# that runs on every push is the one that needs nothing but Linux, and
# everything that needs Xcode runs on pull requests and on request. Put the
# macOS jobs back on push when the repository goes public.
#
# One correction worth keeping, because the wrong version was committed first:
# the four-second failures were blamed on the macOS multiplier, and moving the
# push check to Ubuntu did not fix them. Ubuntu cannot start in four seconds
# either. The multiplier was real and the diagnosis was still wrong.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every push. Ubuntu, one minute, no Xcode involved.
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run typecheck
        working-directory: backend

  # The silent-failure checks: the guessing round's name masking and the upsell
  # rhythm. Both compile a source file of the app against a checking harness, so
  # both need a Swift toolchain, so both need macOS here.
  #
  # This runs `scripts/verify.sh` — the same command the README gives a human,
  # rather than a CI-only reimplementation of it that can drift from the one
  # people actually run. What that script deliberately leaves out (anything that
  # spends model credit, and the UI tests, which need a simulator of their own)
  # is argued in its header.
  invariants:
    name: Invariants
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Not 20. Seven checks in verify.sh import the backend's TypeScript
          # directly, and Node strips types by default only from 22.18. Measured
          # 25 Sep 2026 with `--no-experimental-strip-types`, which is where 20
          # stands: all seven fail with ERR_UNKNOWN_FILE_EXTENSION, and pass
          # without the flag on 24, the version verify.sh is run on here.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: ./scripts/verify.sh

  # Compiles the app from a clean checkout. No device is named on purpose: the
  # destination this repo needs locally is a UDID, because four simulators here
  # share the name "iPhone 17 Pro" — a runner has that problem in reverse,
  # having no such device at all.
  build:
    name: iOS build
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, never committed: XcodeGen globs the source
      # files, so a checkout has to generate before it can build.
      - name: Generate the project
        run: xcodegen generate
        working-directory: ios

      - name: Build
        run: |
          xcodebuild -project ios/Kinlore.xcodeproj -scheme Kinlore \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation build
