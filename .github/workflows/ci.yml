# The checks a stranger can trust without taking anybody's word for it.
#
# `verify` runs `scripts/verify.sh` — the same command the README gives a human,
# rather than a CI-only reimplementation of it that can drift from the one
# people actually run. What that script deliberately leaves out (anything that
# spends model credit, and the UI tests, which need a simulator of their own) is
# argued in its header.
#
# `build` compiles the app for a generic simulator. No device is named on
# purpose: the destination this repo needs locally is a UDID, because four
# simulators here share the name "iPhone 17 Pro" — a runner has that problem in
# reverse, having no such device at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Invariants and types
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: ./scripts/verify.sh

  # Not on every push, and the reason is a quota rather than taste. Actions is
  # free on public repositories and metered on private ones, where a macOS
  # minute counts as ten — so the free allowance is worth about 200 minutes of
  # this runner. Several sessions push to main daily, and this job resolves a
  # Swift package before it compiles anything.
  #
  # Running out does not fail the build; it stops the runs. The badge would
  # then keep showing the last green tick, which is this repo's favourite kind
  # of bug: a check that has quietly stopped checking. So the expensive half
  # runs on pull requests and on request, and `verify` — two minutes, and the
  # one that catches silent breakage — stays on every push.
  #
  # Put this back on push when the repository goes public.
  build:
    name: iOS build
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, never committed: XcodeGen globs the source
      # files, so a checkout has to generate before it can build.
      - name: Generate the project
        run: xcodegen generate
        working-directory: ios

      - name: Build
        run: |
          xcodebuild -project ios/Kinlore.xcodeproj -scheme Kinlore \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation build
