# The checks a stranger can trust without taking anybody's word for it.
#
# While this repository was private, a push ran nothing. The account's
# included Actions minutes were spent (read on the billing page), and a run
# refused for that failed in four to five seconds with no step executed, which
# looks from outside exactly like a broken build. So the push job is skipped
# on a private repository: a job whose `if:` is false is never started, and
# GitHub reports it as skipped rather than failed. On the public repository,
# where Actions is free, it runs on every push. The four-second failures were
# first blamed on the macOS multiplier, and moving this job to Ubuntu did not
# fix them, because no runner was ever started.
#
# Everything that needs Xcode runs on pull requests and on request, as it did
# while the repository was private, where a macOS minute counts as ten.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every push. Ubuntu, one minute, no Xcode involved. Skipped while the
  # repository is private (see the top of this file).
  types:
    name: Types
    runs-on: ubuntu-latest
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run typecheck
        working-directory: backend

  # The silent-failure checks. Many of them compile a source file of the app
  # against a checking harness, so they need a Swift toolchain, so they need
  # macOS here.
  #
  # This runs `scripts/verify.sh` — the same command the README gives a human,
  # rather than a CI-only reimplementation of it that can drift from the one
  # people actually run. What that script deliberately leaves out (anything that
  # spends model credit, and the UI tests, which need a simulator of their own)
  # is argued in its header.
  invariants:
    name: Invariants
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Not 20. Seven checks in verify.sh import the backend's TypeScript
          # directly, and Node strips types by default only from 22.18. Measured
          # 25 Sep 2026 with `--no-experimental-strip-types`, which is where 20
          # stands: all seven fail with ERR_UNKNOWN_FILE_EXTENSION, and pass
          # without the flag on 24, the version verify.sh is run on here.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: ./scripts/verify.sh

  # Compiles the app from a clean checkout. No device is named on purpose: the
  # destination this repo needs locally is a UDID, because four simulators here
  # share the name "iPhone 17 Pro" — a runner has that problem in reverse,
  # having no such device at all.
  build:
    name: iOS build
    runs-on: macos-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, never committed: XcodeGen globs the source
      # files, so a checkout has to generate before it can build.
      - name: Generate the project
        run: xcodegen generate
        working-directory: ios

      - name: Build
        run: |
          xcodebuild -project ios/Kinlore.xcodeproj -scheme Kinlore \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation build
